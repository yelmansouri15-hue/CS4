{% extends "layout.html" %}

{% block title %}
    Register 
{% endblock %}

{% block main %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm mt-4">
                    <div class="card-body p-4"><h3 class="text-center mb-4">Create Account</h3>
                    <form action="/register" method="post" >
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input autocomplete="off" autofocus class="form-control" name="username" placeholder="Username" type="text" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input class="form-control" name="password" placeholder="••••••••" type="password" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Confirm Password</label>
                            <input class="form-control" name="confirmation" placeholder="Confirm Password" type="password" required>
                        </div>
                        <div class="mb-4">
                            <select class="form-select" name="role" required>
                                <option disabled selected value="">What is your role?</option>
                                <option>Professor</option>
                                <option>Student</option>
                            </select>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
