{% extends "layout.html" %}

{% block title %}My Students{% endblock %}

{% block main %}
    <h2 class="mb-4">My Students</h2>

    <!-- Add new student to roster -->
    <div class="card mb-4 shadow-sm col-md-6">
        <div class="card-body">
            <form action="/roster" method="post" class="d-flex gap-2">
                <input type="hidden" name="action" value="add">
                <select class="form-select" name="student_id" required>
                    <option disabled selected value="">Select a student to add...</option>
                    {% for s in other_students %}
                        <option value="{{ s.id }}">{{ s.username }}</option>
                    {% endfor %}
                </select>
                <button type="submit" class="btn btn-primary">Add</button>
            </form>
        </div>
    </div>

    <!-- List of current students -->
    <ul class="list-group col-md-6">
        {% for s in my_students %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ s.username }}
                <form action="/roster" method="post" class="m-0">
                    <input type="hidden" name="action" value="remove">
                    <input type="hidden" name="student_id" value="{{ s.id }}">
                    <button type="submit" class="btn btn-sm btn-danger">Remove</button>
                </form>
            </li>
        {% else %}
            <li class="list-group-item text-muted">You haven't added any students yet.</li>
        {% endfor %}
    </ul>
{% endblock %}
