{% extends "layout.html" %}

{% block title %}
    Log In 
{% endblock %}

{% block main %}
    <div class="row justify-content-center">
        <div class="col-md-4 col-sm-8 mt-5">
            <div class="card shadow-sm">
                <div class="card-body p-4 text-center">
                    <h3 class="mb-4">Welcome Back</h3>
                    <form action="/login" method="post">
                        <div class="mb-3 text-start">
                            <label class="form-label text-muted small text-uppercase fw-bold">Username</label>
                            <input autocomplete="off" autofocus class="form-control" name="username" placeholder="Username" type="text" required>
                        </div>
                        <div class="mb-4 text-start">
                            <label class="form-label text-muted small text-uppercase fw-bold">Password</label>
                            <input class="form-control" name="password" placeholder="••••••••" type="password" required>
                        </div>
                        <button class="btn btn-primary w-100 mb-2" type="submit">Log In</button>
                    </form>
                    <div class="mt-3">
                        <small class="text-muted">Don't have an account? <a href="/register" class="text-decoration-none">Register here</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
