{% extends "layout.html" %}

{% block title %}
    Add Class
{% endblock %}

{% block main %}
    <h2 class="mb-4">Schedule Recurring Class</h2>

    <div class="card shadow-sm col-md-8 mx-auto">
        <div class="card-body">
            <form action="/classes" method="post">
                <input type="hidden" name="action" value="add">

                <div class="mb-3">
                    <label class="form-label">Student</label>
                    <select class="form-select" name="student_id" required>
                        <option disabled selected value="">Select student...</option>
                        {% for s in students %}
                            <option value="{{ s.id }}">{{ s.username }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Day of the Week</label>
                    <select class="form-select" name="day_of_week" required>
                        <option value="0">Monday</option>
                        <option value="1">Tuesday</option>
                        <option value="2">Wednesday</option>
                        <option value="3">Thursday</option>
                        <option value="4">Friday</option>
                        <option value="5">Saturday</option>
                        <option value="6">Sunday</option>
                    </select>
                </div>

                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">Start Time</label>
                        <input type="time" class="form-control" name="time_start" required>
                    </div>
                    <div class="col">
                        <label class="form-label">End Time</label>
                        <input type="time" class="form-control" name="time_end" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">Price (€)</label>
                        <input type="number" step="0.01" class="form-control" name="price" placeholder="15.00" required>
                    </div>
                    <div class="col">
                        <label class="form-label">Repeat for (weeks)</label>
                        <input type="number" class="form-control" name="weeks_count" value="12" min="1" max="52" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Create Reservation</button>
            </form>
        </div>
    </div>
{% endblock %}
